name: Deploy GitHub Pages

# Stages docs/ + every published release's firmware ZIP into a single static
# site. Refreshed on doc edits, on each release publish, and on demand.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      # tools/settings.html is the canonical source; pages.yml copies it
      # into _site/. Without this trigger the hosted settings page stays
      # stale when settings.html is the only file that changed.
      - 'tools/settings.html'
      # Shared settings-page helpers, loaded by settings.html as a sibling
      # <script src> — deployed next to it (and inlined into the firmware's
      # settings_wifi.html at build time).
      - 'tools/settings_common.js'
      # The avatar preview module (avatar_module.js) and standalone
      # avatar.html are built from these on every deploy; rebuild when the
      # source, the VM, the JS DSL compiler or the default DSL changes.
      - 'wasm/**'
      - 'components/avatar/**'
      - 'components/avatar_vm/**'
      - 'tools/avatar_dsl/**'
      # All DSL preset sources (default / omega / future additions) are
      # inlined into avatar.html + settings_wifi.html via inject.mjs, so a
      # change to any of them must rebuild the Pages site.
      - 'assets/*.avdsl'
      # HMM voice catalog: the .htsvoice files + voices.json manifest served
      # for the on-device "サーバーから取得" install path (voice_fetch).
      - 'assets/voices/**'
      - 'assets/voices.json'
      - '.github/workflows/pages.yml'
      # Release mirroring / versions.json generator.
      - 'script/stage_pages_firmware.py'
      - 'script/release_channels.py'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # tl_expected is a submodule that the avatar_vm now depends on
          # (`<tl/expected.hpp>`). M5GFX / M5Unified aren't touched by the
          # WASM build but checking everything keeps things simple.
          submodules: recursive

      - name: Build avatar preview module (Emscripten/WASM)
        run: |
          set -euo pipefail
          # Same Docker image + script used locally (wasm/build.sh). Produces
          # build/avatar_web/avatar_module.js (single-file, wasm embedded) +
          # avatar.html (standalone shell with the DSL editor).
          bash wasm/build.sh
          test -f build/avatar_web/avatar_module.js
          test -f build/avatar_web/avatar.html

      - name: Stage docs/ + tools/settings.html + avatar module into _site/
        run: |
          mkdir -p _site
          cp -a docs/. _site/
          # Canonical settings page lives under tools/ for local development
          # (file:// + sshfs / python http.server). For deploy we run
          # tools/avatar_dsl/inject.mjs to inline the DSL compiler bundle
          # and the preset sources — same script that processes
          # settings_wifi.html for the firmware build, so the two pages
          # offer identical authoring UX (the difference is the send path:
          # HTTP POST on the Wi-Fi page, BLE chr 0x21 chunked write here).
          # Without injection the page still works in file:// dev — the
          # DSL editor just reports "コンパイラ未起動".
          node tools/avatar_dsl/inject.mjs \
              tools/settings.html \
              _site/settings.html \
              "default=assets/default_face.avdsl" \
              "omega=assets/omega_mouth.avdsl" \
              "aokko=assets/aokko_face.avdsl"
          # Shared settings-page helpers — settings.html references this as
          # a sibling <script src="settings_common.js">.
          cp tools/settings_common.js _site/settings_common.js
          # Avatar preview module embedded by settings.html (built above).
          cp build/avatar_web/avatar_module.js _site/avatar_module.js
          # Standalone preview page (shell UI + canvas + DSL editor) — same
          # WASM blob inlined via SINGLE_FILE, no sibling asset deps.
          cp build/avatar_web/avatar.html _site/avatar.html
          # HMM voice catalog for the on-device server-fetch install path:
          #   _site/voices.json            (manifest the device proxies via /api/voices)
          #   _site/voices/<id>.htsvoice   (voice_fetch downloads voices/<id>.htsvoice)
          # Only staged when present so the repo can ship without bundled
          # voices. .htsvoice files are license-clean (CC BY); attribution is
          # in the manifest + the LICENSE_* files copied alongside.
          if [ -d assets/voices ]; then
            mkdir -p _site/voices
            cp -a assets/voices/. _site/voices/
          fi
          if [ -f assets/voices.json ]; then
            cp assets/voices.json _site/voices.json
          fi

      - name: Stage release firmware ZIPs into _site/firmware/<tag>/
        env:
          GH_TOKEN: ${{ github.token }}
        # Mirrors every published release's firmware-*.zip (plus the
        # extracted per-board stackchan_idf.bin for release-fetch OTA) and
        # writes two manifests:
        #   _site/versions.json      stable releases only — what already
        #                            deployed firmware reads via
        #                            /api/release/versions (its settings page
        #                            pre-selects the first entry as "latest",
        #                            so pre-releases must never appear here)
        #   _site/versions-all.json  every channel (alpha / beta / rc /
        #                            stable) with a `channel` field; the Web
        #                            Flasher and the settings pages filter it
        #                            by the channel the user picked.
        # Retention (script docstring has the details): stable >= v0.7.0;
        # pre-releases only while no stable of the same or newer X.Y.Z
        # exists. Keeps the site artifact under the 1 GB Pages limit.
        run: |
          set -euo pipefail
          python3 script/stage_pages_firmware.py --repo "$GITHUB_REPOSITORY" --site _site
          echo "--- versions.json ---"
          cat _site/versions.json
          echo "--- _site/firmware ---"
          find _site/firmware -maxdepth 2 -type f | sort

      - uses: actions/configure-pages@v5
        with:
          # Auto-enable GitHub Pages with the "GitHub Actions" source on
          # first run. Without this the action returns 404 ("Get Pages
          # site failed") unless someone manually enables Pages in
          # Settings → Pages first.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
