name: Build and Release Firmware

# Tag-driven release: push `vX.Y.Z` to build the firmware in the official
# ESP-IDF container and attach the artifacts to a GitHub Release. Manual
# dispatch is supported too for smoke-testing the CI without cutting a tag.
#
# Layout (2026-06 onwards):
#   0. `plan` job derives the version / release channel / board list from
#      the tag (script/release_channels.py). Channels (2026-09):
#        vX.Y.Z-alpha.N → alpha  (cores3 + atoms3r only, GitHub pre-release)
#        vX.Y.Z-beta.N  → beta   (all boards, pre-release)
#        vX.Y.Z-rc.N    → rc     (all boards, pre-release)
#        vX.Y.Z         → stable (all boards, becomes "Latest")
#      A tag that doesn't match this grammar fails the run before building.
#   1. `build` job runs once per board in parallel (matrix from `plan`),
#      each shard does its own checkout + env init + ccache-warmed build +
#      zip + artifact upload. Per-shard ccache cache survives across runs
#      and pulls main branch hits even on a fresh tag, keeping compile time
#      ~30 s after the first warm-up.
#   2. `release` job (needs: build) downloads the artifacts and attaches
#      them to a single GitHub Release in one go. Only runs on tag pushes.
#
# Previously the build was one sequential job to avoid paying the Docker
# pull + apt install + IDF env setup 4× (was ~2 min × 4 in the old plain
# matrix). With matrix shards on separate VMs the env-init cost is paid
# 4× but happens in parallel — wall-clock impact is ≈ 1× pull. The
# ccache cache cuts the per-shard compile from ~3 min to ~30 s once warm,
# so the wall-clock floor becomes the env-init step (~90 s) rather than
# the compile, and we no longer benefit from sharing the env across the
# 4 boards inside one job.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# softprops/action-gh-release needs to create a Release on the repo. Default
# token scopes are tight under modern GitHub orgs / repo settings, so grant
# `contents: write` here explicitly rather than relying on
# Settings → Actions → Workflow permissions.
permissions:
  contents: write

jobs:
  plan:
    name: Plan (version / channel / boards)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      boards: ${{ steps.plan.outputs.boards }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: script
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
            # Refuse typos like v0.15.0-alpha1 before spending 4 build VMs.
            python3 script/release_channels.py --tag "$VERSION" validate
          else
            VERSION="dev-${GITHUB_SHA::8}"
          fi
          CHANNEL=$(python3 script/release_channels.py --tag "$VERSION" channel)
          PRERELEASE=$(python3 script/release_channels.py --tag "$VERSION" prerelease)
          BOARDS=$(python3 script/release_channels.py --tag "$VERSION" boards)
          {
            echo "version=$VERSION"
            echo "channel=$CHANNEL"
            echo "prerelease=$PRERELEASE"
            echo "boards=$BOARDS"
          } >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION  channel: $CHANNEL  prerelease: $PRERELEASE  boards: $BOARDS"

  build:
    name: Build ${{ matrix.board }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # Don't kill sibling shards on one board's failure — we still want
      # to know which other boards built OK so we can rerun only the bad
      # one. The aggregating release job below depends on all of the
      # artifacts though, so a partial success still won't publish.
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.plan.outputs.boards) }}
    container:
      # Pinned to v5.5 to match local development. v6.0 dropped the built-in
      # `json` (cJSON) component in favour of an IDF component-manager
      # dependency; our `conversation` component requires it directly and
      # we don't ship a manifest entry for it yet.
      image: espressif/idf:v5.5.5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0  # full history so `git describe --tags` resolves

      - name: Verify git version information
        shell: bash
        run: |
          # Container's git refuses operations in a workspace it doesn't own;
          # mark it safe before any git command.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "=== Git Information ==="
          git describe --tags --abbrev=0 || echo "(no tags found)"
          git rev-parse --short HEAD
          git diff-index --quiet HEAD -- && echo "Working tree clean" || echo "Working tree dirty"
          echo "Current ref: ${GITHUB_REF}"

      - name: Install Node.js (avatar DSL compiler)
        shell: bash
        # components/avatar_vm/CMakeLists.txt invokes `node tools/avatar_dsl/cli.mjs`
        # at build time to compile the default avatar face DSL into the
        # bytecode that gets embedded into the firmware. The espressif/idf
        # Debian image does not ship Node, so install it from the distro repo
        # (the compiler is plain ESM that only needs a recent v18+).
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs
          node --version

      - name: Apply M5Unified patches
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/components/M5Unified"
          tools/apply-m5-patches.sh

      - name: ccache (compiler cache)
        # Per-board cache key — the same .c source can compile differently
        # for different boards (sdkconfig.defaults.<board> changes target /
        # PSRAM mode / Kconfig macros), so we don't try to share .o files
        # across shards. Restore-keys lets a new tag still pick up the
        # most recent main-branch cache on cold start.
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: idf-v5.5-${{ matrix.board }}-${{ github.ref_name }}
          restore-keys: |
            idf-v5.5-${{ matrix.board }}-
          max-size: 500M
          variant: ccache
          # Tell ESP-IDF's cmake module to actually invoke ccache. Without
          # this env var ESP-IDF skips its compiler-launcher hook even if
          # ccache is on PATH.
          create-symlink: true

      - name: Extract version
        id: version
        shell: bash
        run: |
          # Resolved once in the `plan` job so every shard and the release
          # job agree on the string (it's also stamped into esp_app_desc).
          VERSION="${{ needs.plan.outputs.version }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (channel ${{ needs.plan.outputs.channel }})"

      - name: Pin PROJECT_VER for the build
        # `tools/apply-m5-patches.sh` modifies the M5Unified submodule's
        # working tree, which makes ESP-IDF's internal
        # `git describe --tags --dirty` (run during cmake) tack a -dirty
        # suffix onto the version stamped into esp_app_desc. Writing the
        # resolved version to version.txt at the project root takes priority
        # over git_describe (see project.cmake's PROJECT_VER resolution
        # order: version.txt > project(VERSION ...) > git describe) and
        # gives us a clean, deterministic version string in CI builds.
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "$VERSION" > version.txt
          echo "version.txt contents: $(cat version.txt)"

      - name: Build firmware for ${{ matrix.board }}
        shell: bash
        env:
          CI: true
          VERSION: ${{ steps.version.outputs.version }}
          BOARD: ${{ matrix.board }}
          IDF_CCACHE_ENABLE: "1"
        run: |
          set -euo pipefail
          . $IDF_PATH/export.sh
          echo "=== ccache config ==="
          ccache --version | head -1
          ccache --show-config | grep -E "max_size|cache_dir|compiler_check" || true
          echo "=== Cleaning build-$BOARD ==="
          rm -rf "build-$BOARD"
          echo "=== Setting target for $BOARD ==="
          make set-target BOARD="$BOARD"
          echo "=== Building $BOARD ==="
          make build BOARD="$BOARD"
          echo "=== Building Recovery for $BOARD (ADR-001) ==="
          # Recovery は固定領域に置く小さな更新専用アプリ (recovery/)。ブートローダーは
          # Main と同じ bootloader_components/main。version.txt は recovery/ にも置く。
          cp version.txt recovery/version.txt
          rm -rf "recovery/build-$BOARD"
          make -C recovery set-target BOARD="$BOARD" IDF_PATH="$IDF_PATH"
          make -C recovery build BOARD="$BOARD" IDF_PATH="$IDF_PATH"
          echo "=== ccache stats ==="
          ccache --show-stats || true
          echo "=== Packing release for $BOARD (ADR-001 layout) ==="
          # bootloader / 機体正本の標準表 / bootctl / recovery / exttab / Main と、
          # Web flasher が読む flash_manifest.json、0x0 から書ける結合イメージ。
          python3 script/pack_release.py --board "$BOARD" --version "$VERSION" --out "release/$BOARD"
          cp README.md "release/$BOARD/" 2>/dev/null || true
          echo "=== Firmware size for $BOARD ==="
          python3 -m esp_idf_size "build-$BOARD/stackchan_idf.map" --format=text || true
          (cd "release/$BOARD" && zip -r "../../firmware-${VERSION}-${BOARD}.zip" .)
          ls -lh "firmware-${VERSION}-${BOARD}.zip"

      - name: Upload firmware artifact (${{ matrix.board }})
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.version.outputs.version }}-${{ matrix.board }}
          path: firmware-${{ steps.version.outputs.version }}-${{ matrix.board }}.zip
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: [plan, build]
    # Only attach to a Release on actual tag pushes — manual dispatch runs
    # just build the artifacts and stop. The matrix shards all upload
    # their own artifact; this job aggregates them.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION="${{ needs.plan.outputs.version }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          # Channel banner at the top of the release notes. Pre-releases are
          # only offered by the Web Flasher / settings pages when the reader
          # opts into that channel, so say so here too.
          case "${{ needs.plan.outputs.channel }}" in
            stable) BANNER="" ;;
            *) BANNER="> **⚠ ${{ needs.plan.outputs.channel }} 版 (pre-release)** — 検証用のビルドです。対応ボードは下記のとおりで、正式版は [Latest](https://github.com/${GITHUB_REPOSITORY}/releases/latest) を参照してください。Web Flasher / 設定ページでは「チャンネル」で **${{ needs.plan.outputs.channel }}** を選ぶと表示されます。" ;;
          esac
          {
            echo "banner<<EOF"
            echo "$BANNER"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          # Board list for the notes (alpha ships a subset).
          BOARDS_MD=$(echo '${{ needs.plan.outputs.boards }}' | python3 -c '
          import json, sys
          labels = {
            "cores3":    "**CoreS3 + M5/Takao ベース** (`firmware-{v}-cores3.zip`、16 MB flash / Quad PSRAM)",
            "atoms3r":   "**AtomS3R + Atomic ECHO BASE** \"アトムニャン\" (`firmware-{v}-atoms3r.zip`、8 MB flash / Octal PSRAM)",
            "atoms3":    "**AtomS3 + Atomic ECHO BASE** slim プロファイル (`firmware-{v}-atoms3.zip`、8 MB flash / PSRAM なし)",
            "stopwatch": "**M5 StopWatch (C152)** 円形 AMOLED 466×466 + ES8311 + BMI270 + RX8130CE + 振動モータ (`firmware-{v}-stopwatch.zip`、16 MB flash / Octal PSRAM)",
          }
          v = sys.argv[1]
          print("\n".join("- " + labels[b].format(v=v) for b in json.load(sys.stdin)))
          ' "$VERSION")
          {
            echo "boards_md<<EOF"
            echo "$BOARDS_MD"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          # Glob over the per-board artifact names uploaded by the build
          # matrix. merge-multiple flattens them into one directory.
          pattern: firmware-${{ steps.version.outputs.version }}-*
          merge-multiple: true

      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        with:
          # Whatever boards this channel built (alpha = 2, others = 4).
          files: firmware-${{ steps.version.outputs.version }}-*.zip
          fail_on_unmatched_files: true
          # Pre-release tags never become "Latest": the Releases page, the
          # /releases/latest redirect and the pre-release badge all follow
          # the channel derived from the tag.
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.plan.outputs.prerelease != 'true' }}
          body: |
            # Stack-chan Firmware ${{ steps.version.outputs.version }}

            ${{ steps.version.outputs.banner }}

            Stack-chan firmware (M5Stack CoreS3 / AtomS3R / AtomS3 / StopWatch 四方対応)。

            ## 対応ボード (このリリースに含まれる firmware)
            ${{ steps.version.outputs.boards_md }}

            PSRAM モードは bootloader レベルで確定するため、ボードごとに別 firmware です。

            ## パーティション構成 (ADR-001)
            このリリースから flash の構成が変わりました (Recovery アプリ + 拡張パーティションテーブル)。
            旧構成 (2 面 OTA) の機体には **USB での初回書き込みが必要** で、BLE / Wi-Fi の OTA では
            移行できません。書き込むと保存済みの顔データ・HMM ボイス・sanoTTS の重みは消えます
            (Wi-Fi などの設定は残ります。結合イメージ `firmware-<ver>-<board>.bin` を 0x0 に書く場合は
            設定も消えます)。以後の更新は Recovery 経由で行われます (設定ページからの release 取得、
            BLE / HTTP アップロード)。ZIP の `flash_manifest.json` に各イメージの書き込み位置があります。

            ## Features
            - **OpenAI Realtime API / Google Gemini Live API** どちらかでリアルタイム音声会話
            - **BLE 経由の設定 / プロビジョニング** (X25519 + AES-256-GCM 暗号化セッション)
            - **BLE OTA アップデート**(再ビルド不要で次回からはブラウザから直接書き込み)
            - **jtts 音声合成**: フォルマント / 単位連結 (TD-PSOLA) / **HMM (hts_engine)** の
              3 エンジン。HMM ボイス (.htsvoice) は設定ページからアップロード、または
              「サーバーから取得」で配布ボイス (Mei, CC BY 3.0) を直接インストール (16 MB ボード)
            - **jtts ボイス カスタマイズ**(声・フレーズ・エンジンを設定画面から変更)
            - **タッチセンサによる barge-in / なでなで応答** (CoreS3 のみ)
            - 第三者ライセンス / 帰属表示: <https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/licenses.html>

            ## Installation

            ### Web Flasher (Chrome / Edge)
            <https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/>
            にアクセスして本リリースを選択し、ボードを選んでから書き込んでください。

            ### コマンドラインから初回書き込み
            1. ボードに合った ZIP (`-cores3` / `-atoms3r` / `-atoms3` / `-stopwatch`) をダウンロード・展開
            2. esptool で書き込み (結合イメージ。NVS 設定も初期化される):
               ```bash
               esptool.py --chip esp32s3 --port /dev/ttyACM0 --baud 460800 write_flash \
                 0x0 firmware-${{ steps.version.outputs.version }}-<board>.bin
               ```
               設定を残したい場合は ZIP を展開して `flash_args` の一覧どおりに個別に書き込む:
               ```bash
               esptool.py --chip esp32s3 --port /dev/ttyACM0 --baud 460800 write_flash @flash_args
               ```

            ### OTA(既に ADR-001 構成で動いている場合)
            1. <https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/settings.html>
            2. BLE 接続後「ファームウェア更新 (OTA)」でリリースを選ぶと、機体が Recovery で
               再起動して Wi-Fi で取得します (約 30 秒)。Wi-Fi が無い場合は同梱の
               `stackchan_idf.bin` を選ぶと BLE で転送します (4〜5 分)

            ## Build Information
            - **ESP-IDF**: v5.5.5
            - **Target**: ESP32-S3
            - **Build Date**: ${{ steps.version.outputs.build_date }}
            - **Commit**: ${{ github.sha }}

            ## Full Changelog
            https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
