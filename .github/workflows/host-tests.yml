name: Host Unit Tests

# ESP-IDF independent unit tests that build with a plain gcc + cmake toolchain
# on ubuntu-latest — no ESP-IDF container, no cross toolchain. These cover the
# pure-logic parts of the firmware (avatar bytecode VM decode/execute, SCS0009
# servo protocol framing/checksum/parse, jtts vowel synthesis) and run on every
# push / PR so regressions surface long before a tagged firmware build.
#
# The firmware build itself lives in release.yml (tag-driven, in the espressif
# IDF container); this job is deliberately separate and fast.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: Host unit tests (gcc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # tl_expected is a submodule the tests include (<tl/expected.hpp>).
          # M5GFX / M5Unified are NOT needed — avatar_vm host tests use the
          # in-repo WASM shim (wasm/shim/M5GFX.h) instead.
          submodules: 'recursive'

      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ ninja-build

      - name: Show toolchain versions
        run: |
          cmake --version | head -1
          g++ --version | head -1

      # --- avatar_vm: bytecode decoder + VM interpreter + fuzz -------------
      # Built twice: once plain (fast, exhaustive) and once under
      # ASan + UBSan so the fuzz harness proves memory safety on arbitrary
      # input.
      - name: avatar_vm host tests
        working-directory: components/avatar_vm/test/host
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: avatar_vm host tests (ASan + UBSan)
        working-directory: components/avatar_vm/test/host
        run: |
          set -euo pipefail
          cmake -S . -B build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          cmake --build build-san
          ctest --test-dir build-san --output-on-failure

      # --- avatar: balloon scroll layout (pure functions, header only) ------
      - name: avatar host tests
        working-directory: components/avatar/test/host
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build
          ctest --test-dir build --output-on-failure

      # --- flash_layout: ADR-001 exttab / bootctl format --------------------
      # format.c is the exact source the custom bootloader compiles, so the
      # validation / A-B selection / boot-decision logic is proven here.
      - name: flash_layout host tests
        working-directory: components/flash_layout/test/host
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: flash_layout host tests (ASan + UBSan)
        working-directory: components/flash_layout/test/host
        run: |
          set -euo pipefail
          cmake -S . -B build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          cmake --build build-san
          ctest --test-dir build-san --output-on-failure

      # --- saanotts: vendored sanoTTS-jp core (build only) -------------------
      # The acceptance tests need the non-MIT weight blob, which is not in the
      # repo; CI just proves the vendored C99 core compiles on a plain gcc.
      - name: saanotts host build
        working-directory: components/saanotts/test/host
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      # --- scs_servo: SCS0009 protocol + path generator -------------------
      - name: scs_servo host tests
        working-directory: components/scs_servo/test/host
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: scs_servo host tests (ASan + UBSan)
        working-directory: components/scs_servo/test/host
        run: |
          set -euo pipefail
          cmake -S . -B build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          cmake --build build-san
          ctest --test-dir build-san --output-on-failure

      # --- jtts: existing vowel-synthesis test ----------------------------
      # jtts/test/host predates ctest wiring, so drive its executable directly.
      - name: jtts host tests
        working-directory: components/jtts/test/host
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ./build/jtts_test_vowels
          ./build/jtts_test_sano_ir
          # sanoTTS clause-by-clause synthesis (clause split / edge-silence trim /
          # inter-clause pause). The 1-clause synth is stubbed, so no weights needed.
          ./build/jtts_test_clause_stream
          # Vowel lip-sync events, long-text chunking, streaming synthesis and
          # subtitle mapping. Without arguments only the formant / pure-logic
          # cases run; with .htsvoice files the HMM cases run too (16 kHz voice
          # = native rate, fast).
          ./build/jtts_test_visemes
          ./build/jtts_test_hmm_chunk
          ./build/jtts_test_visemes ../../../../assets/voices/mei16.htsvoice
          ./build/jtts_test_hmm_chunk ../../../../assets/voices/mei16.htsvoice
